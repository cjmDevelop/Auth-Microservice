spring:
  application:
    name: auth-microservice
  
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect  
  
  # Redis - (not using yet)
  # data:
  #   redis:
  #     host: ${REDIS_HOST:localhost}
  #     port: ${REDIS_PORT:6379}

  # Amazon SES SMTP Configuration (us-east-2 - Ohio)
  mail:
    host: email-smtp.us-east-2.amazonaws.com
    port: 587
    username: ${AWS_SES_SMTP_USERNAME}
    password: ${AWS_SES_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

# Resend Configuration
resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}

app:
  frontend-url: ${FRONTEND_URL:https://randomwritesrandomlights.com}
  verification:
    code-length: 6
    expiration-minutes: 15

logging:
  level:
    com.authservice: INFO
    org.springframework.security: WARN
    org.springframework.mail: WARN
    org.springframework.jdbc: WARN
    org.springframework.boot.autoconfigure: WARN